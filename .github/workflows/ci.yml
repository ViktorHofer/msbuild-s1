name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  CI:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build ClashTest.slnx --configuration Release /bl:build.binlog

      - name: Upload binlog
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: binlog
          path: build.binlog
          retention-days: 7
